<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flexbox Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 1. Header -->
        <header class="header">
            <h1>Header</h1>
        </header>

        <!-- 2. Navigation -->
        <nav class="nav">
            Navigation (Menu)
        </nav>

        <!-- Container chứa Nội dung chính và Cột phụ -->
        <div class="main-container">
            <!-- 3. Main Content -->
            <main class="content">
                <h2>Main Content</h2>
                <p>Đây là khu vực hiển thị nội dung chính của trang web. Bố cục này sử dụng CSS Flexbox.</p>
            </main>

            <!-- 4. Sidebar -->
            <aside class="sidebar">
                <h3>Sidebar</h3>
                <p>Nội dung phụ, quảng cáo, tin tức nổi bật...</p>
            </aside>
        </div>

        <!-- 5. Footer -->
        <footer class="footer">
            Footer - Thông tin cuối trang
        </footer>
    </div>
</body>
</html>
